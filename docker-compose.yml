services:
  redis:
    image: redis:7-alpine
    container_name: hitlimit-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - redis
      - test
      - all

  redis-persistent:
    image: redis:7-alpine
    container_name: hitlimit-redis-persistent
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    profiles:
      - persistent

  postgres:
    image: postgres:16-alpine
    container_name: hitlimit-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: hitlimit_test
      POSTGRES_USER: hitlimit
      POSTGRES_PASSWORD: hitlimit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitlimit -d hitlimit_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - postgres
      - test
      - all

  valkey:
    image: valkey/valkey:8-alpine
    container_name: hitlimit-valkey
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - valkey
      - test
      - all

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: hitlimit-dragonfly
    ports:
      - "6382:6379"
    ulimits:
      memlock: -1
    command: dragonfly --proactor_threads=1 --maxmemory=512mb
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - dragonfly
      - test
      - all

  mongodb:
    image: mongo:7-jammy
    container_name: hitlimit-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hitlimit_test
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - mongodb
      - test
      - all

  mysql:
    image: mysql:8.4
    container_name: hitlimit-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: hitlimit
      MYSQL_DATABASE: hitlimit_test
      MYSQL_USER: hitlimit
      MYSQL_PASSWORD: hitlimit
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - mysql
      - test
      - all

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: hitlimit-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - debug

volumes:
  redis-data:
